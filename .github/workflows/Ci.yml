name: CI — Test & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Shared concurrency lock with data_refresh.yml. Any combination of these
# workflows queues against this single group, so they never race.
concurrency:
  group: site-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── JOB 1: Test ───────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy pyyaml odfpy --break-system-packages -q
      # Rebuild pages BEFORE testing so the suite validates freshly-generated
      # output, not stale committed HTML. Without this, any template change makes
      # the schema/content checks fail against old pages.
      - name: Build pages (for testing)
        run: |
          python3 scripts/build_school_pages.py
          python3 scripts/build_borough_hubs.py
      # Data-quality gate: fails the build on fabricated / malformed data
      # (fake school names, synthetic postcodes, unsourced agent values, etc.)
      - name: Data quality check
        run: python3 scripts/data_quality.py --strict
      - name: Run test suite
        run: python3 scripts/test_site.py

  # ── JOB 2: Build & deploy (only after tests pass, only on main) ────
  build:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy pyyaml odfpy --break-system-packages -q

      - name: Build school pages
        run: python3 scripts/build_school_pages.py

      - name: Build borough hub pages
        run: python3 scripts/build_borough_hubs.py

      - name: Commit and push (with retry)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schools/ sitemap_data.txt robots.txt
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          # [skip ci] keeps this commit from re-triggering CI in an infinite loop.
          git commit -m "chore: rebuild pages [skip ci]"

          # Built pages are DERIVED artifacts. On divergence, the freshly-built
          # local version must win — never rebase/merge generated HTML (identical
          # files regenerated on both sides produce endless conflicts).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — integrating remote, keeping locally-built pages..."
            git fetch origin main
            # Re-apply our commit on top of remote, preferring OUR files on conflict.
            if ! git rebase -X ours origin/main; then
              echo "Conflicts during rebase — forcing local build to win."
              git checkout --ours -- . 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort 2>/dev/null || true
              # Fallback: reset onto remote and re-stage our built artifacts.
              git reset --soft origin/main
              git add schools/ sitemap_data.txt robots.txt
              git commit -m "chore: rebuild pages [skip ci]" || true
            fi
            sleep $((attempt * 3))
          done

          echo "Push failed after 5 attempts." >&2
          exit 1
