name: Monthly Data Refresh

# Runs on the 15th of every month, plus manual trigger.
# Hardened against concurrent-push races (the "fetch first" error).

on:
  schedule:
    - cron: '0 8 15 * *'   # 08:00 UTC on the 15th
  workflow_dispatch: {}

# Shared concurrency lock with Ci.yml. Any workflow that writes to the repo
# uses the same group, so they queue and never race.
concurrency:
  group: site-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Keep history shallow but fetch enough to rebase cleanly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Refresh upstream data
        run: python3 scripts/refresh_data.py

      - name: Reset Snobe URLs
        run: python3 scripts/reset_snobe_urls.py
        continue-on-error: true

      - name: Validate Snobe slugs
        run: python3 scripts/check_snobe_slugs.py
        continue-on-error: true

      - name: Build school pages
        run: python3 scripts/build_school_pages.py

      - name: Build borough hub pages
        run: python3 scripts/build_borough_hubs.py

      - name: Commit and push (with retry)
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit. Nothing to push."
            exit 0
          fi
          git commit -m "Monthly data refresh: $(date -u +'%Y-%m-%d')"

          # Push with up to 5 attempts, rebasing on top of any new remote commits
          # between attempts. Handles the "fetch first" race definitively.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — pulling and rebasing..."
            git pull --rebase --autostash origin main
            sleep $((attempt * 3))
          done

          echo "Push failed after 5 attempts." >&2
          exit 1
