name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 15 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pandas numpy pyyaml

      - name: Refresh data from official sources
        run: python3 scripts/refresh_data.py

      - name: Rebuild static site pages
        run: python3 scripts/build_school_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schools.json schools/ sitemap_data.txt robots.txt
          git diff --staged --quiet || git commit -m "chore: data refresh $(date +'%Y-%m')"
          git push
