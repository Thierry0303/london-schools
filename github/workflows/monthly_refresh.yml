name: Monthly Data Refresh

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 8 15 * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy pyyaml

      - name: Rebuild schools.json from official sources
        run: python3 scripts/refresh_data.py

      - name: Fix and validate all Snobe URLs
        run: python3 scripts/reset_snobe_urls.py

      - name: Verify Snobe URLs against live site
        run: python3 scripts/check_snobe_slugs.py
        continue-on-error: true

      - name: Rebuild static site pages
        run: python3 scripts/build_school_pages.py

      - name: Commit updated data and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schools.json schools/ sitemap_data.txt robots.txt
          git diff --staged --quiet || git commit -m "chore: monthly data refresh $(date +'%Y-%m')"
          git push
