// ── SLUGIFY — matches the Python build script exactly ──
function slugify(text) {
  if (!text) return 'unknown';
  return text.toString().toLowerCase()
    .replace(/[''']/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}
function schoolUrl(school) {
  return `/schools/${slugify(school.local_authority)}/${slugify(school.name)}`;
}

// ── ST / SAINT NORMALISER ──
// Makes "St", "St.", "Saint" interchangeable in search. Also lowercases and
// collapses whitespace, so the same query matches all three spellings.
function stSaintNormalize(s) {
  if (s == null) return '';
  return String(s)
    .toLowerCase()
    // "saint" (with optional trailing dot) -> "st"
    .replace(/\bsaint\b\.?/g, 'st')
    // "st." or "st " -> "st "  (ensures word boundary after)
    .replace(/\bst\.?\b/g, 'st')
    .replace(/\s+/g, ' ')
    .trim();
}

function fsmLabel(s) {
  if (!s) return null;
  return { text: s.fsm_label, color: s.fsm_color, bg: s.fsm_bg };
}
function snobeUrl(school) {
  if (!school) return null;
  return school.snobe_url || null;
}

    ? localAuthorities.filter(function(la){ return la.toLowerCase().indexOf(q.toLowerCase()) !== -1; })
    : localAuthorities;
  function toggle(la) {
    if (value.includes(la)) onChange(value.filter(function(x){ return x !== la; }));
    else onChange(value.concat([la]));
  }
  function clearAll() { onChange([]); setQ(''); }
  return (
    <div>
      {value.length > 0 && (
        <div className="borough-selected-tags">
          {value.map(function(la){
            return (

function ScoreCard({ school, compareList, toggleCompare, userCoords }) {
  const band = school.score_band || school.quality_label || 'Unknown';
  const color = BAND_COLORS[band] || '#ccc';
  const admissions = school.admissions;
  const isSelected = compareList && compareList.find(function(s){return s.urn===school.urn;});
  var COMP_BAND = {'Outstanding':100,'Good':75,'Requires improvement':50,'Inadequate':25,'Ungraded (monitoring)':50,'Report card (2025+)':50};
  var bandVal = COMP_BAND[band] || 50;
  var phaseLC = (school.phase || '').toLowerCase();
  var acadRaw = -1;
  if (phaseLC === 'secondary' || phaseLC === '16 plus') {
    if (school.ks4_att8 != null) acadRaw = (school.ks4_att8 / ENG_ATT8_AVG) * 100;
  } else if (phaseLC === 'primary') {
    if (school.ks2_expected_pct != null) acadRaw = (school.ks2_expected_pct / ENG_KS2_EXP_AVG) * 100;

    if (school.ks4_att8 != null) acadRaw = (school.ks4_att8 / ENG_ATT8_AVG) * 100;

  var compositeScore = acadRaw >= 0
    ? Math.round(bandVal * 0.60 + Math.min(100, acadRaw) * 0.40)
    : bandVal;
  var scoreColor = compositeScore >= 85 ? '#27AE60' : compositeScore >= 70 ? '#2980B9' : compositeScore >= 50 ? '#E67E22' : '#C0392B';

    const urnParam = params.get('compare');
    if (!urnParam) return;
    const urns = urnParam.split(',').map(u=>parseInt(u,10)).filter(Boolean).slice(0,3);
    const matched = urns.map(u=>schools.find(s=>s.urn===u)).filter(Boolean);
    if (matched.length >= 2) {
      setCompareList(matched);
      setShowCompare(true);
    }
  }, [schools]);
  const phases = useMemo(() => [...new Set(schools.map(s=>s.phase).filter(Boolean))].sort(), [schools]);
  const localAuthorities = useMemo(() => [...new Set(schools.map(s=>s.local_authority).filter(Boolean))].sort(), [schools]);
  const filtered = useMemo(() => {
    let r = schools;
    if (filters.q) {
      // Normalise both query and school name so "St", "Saint", "St." match.
      const nq = stSaintNormalize(filters.q);
      const pq = filters.q.toLowerCase();
      r = r.filter(s => {
        const nameMatch = s.name && stSaintNormalize(s.name).includes(nq);
        const postcodeMatch = (s.postcode || '').toLowerCase().includes(pq);
        return nameMatch || postcodeMatch;
      });
    }
    if (filters.phase) r = r.filter(s => s.phase === filters.phase);
    if (filters.local_authority.length) r = r.filter(s => filters.local_authority.includes(s.local_authority));
    if (filters.score_band) r = r.filter(s => (s.score_band||s.quality_label) === filters.score_band);
    if (radiusKm && userCoords) r = r.filter(s => s.lat && s.lng && haversineKm(userCoords.lat, userCoords.lng, s.lat, s.lng) <= radiusKm);
    r = [...r];
    function academicScore(s) {
      var p = (s.phase || '').toLowerCase();
      if (p === 'secondary' || p === '16 plus') {
        if (s.ks4_att8 != null) return (s.ks4_att8 / ENG_ATT8_AVG) * 100;
      } else if (p === 'primary') {
        if (s.ks2_expected_pct != null) return (s.ks2_expected_pct / ENG_KS2_EXP_AVG) * 100;
      } else if (p === 'all-through') {
        if (s.ks4_att8 != null) return (s.ks4_att8 / ENG_ATT8_AVG) * 100;
      }
      return -1;
    }
    if (sortBy === 'score') r.sort((a,b) => { var d=(b.ofsted_score??-1)-(a.ofsted_score??-1); return d!==0?d:a.name.localeCompare(b.name); });
    else if (sortBy === 'results') r.sort(function(a,b){ var d=academicScore(b)-academicScore(a); return d!==0?d:a.name.localeCompare(b.name); });
    else if (sortBy === 'name') r.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortBy === 'apps') r.sort((a,b) => { var d=(b.apps_per_place??-1)-(a.apps_per_place??-1); return d!==0?d:a.name.localeCompare(b.name); });
    else if (sortBy === 'pupils') r.sort((a,b) => { var d=(b.pupils??-1)-(a.pupils??-1); return d!==0?d:a.name.localeCompare(b.name); });
    else if (sortBy === 'nearby' && !userCoords) { r.sort((a,b) => { var d=(b.ofsted_score??-1)-(a.ofsted_score??-1); return d; }); }
    else if (sortBy === 'nearby' && userCoords) {
      var BAND_RANK = {'Outstanding':4,'Good':3,'Requires improvement':2,'Inadequate':1,'Ungraded (monitoring)':2,'Report card (2025+)':2};
      r.sort(function(a,b) {
        var bandRankA = BAND_RANK[a.score_band||a.quality_label||''] || 0;
        var bandRankB = BAND_RANK[b.score_band||b.quality_label||''] || 0;
        if (bandRankA !== bandRankB) return bandRankB - bandRankA;
        var distA = (a.lat && a.lng) ? haversineKm(userCoords.lat, userCoords.lng, a.lat, a.lng) : 999;
        var distB = (b.lat && b.lng) ? haversineKm(userCoords.lat, userCoords.lng, b.lat, b.lng) : 999;
        if (Math.abs(distA - distB) > 5) return distA - distB;
        var rawAcadA = academicScore(a); var rawAcadB = academicScore(b);
        var acadA = rawAcadA > 0 ? rawAcadA : (a.ofsted_score || 50);
        var acadB = rawAcadB > 0 ? rawAcadB : (b.ofsted_score || 50);
        var acadMax = Math.max(acadA, acadB);
        var acadGap = Math.abs(acadA - acadB) / (acadMax || 1);
        if (Math.abs(distA - distB) <= 0.5) return acadB - acadA;
        if (acadGap > 0.15 && distA <= 3 && distB <= 3) return acadB - acadA;
        return distA - distB;
      });
    }
    return r;
  }, [schools, filters, sortBy, userCoords, radiusKm]);

  }

      </main>

          </div>
          <div className="compare-guide-step">
            <div className="compare-guide-step-num">2</div>
            <span>Add up to <strong>3 schools</strong> — a bar appears at the bottom</span>
          </div>
          <div className="compare-guide-step">
            <div className="compare-guide-step-num">3</div>
            <span>Click <strong>Compare</strong> to see them side by side</span>
          </div>
        </div>
      )}
      <div className={`compare-bar ${compareList.length>0?'visible':''}`}>
        <div style={{fontSize:'0.78rem',color:'rgba(255,255,255,0.5)',whiteSpace:'nowrap'}}>Compare ({compareList.length}/3)</div>
        <div className="compare-bar-schools">
          {compareList.map(s=>(
            <div key={s.urn} className="compare-bar-chip">
              <span style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
              <button onClick={()=>setCompareList(p=>p.filter(x=>x.urn!==s.urn))}>×</button>
            </div>
          ))}
        </div>
        <button className="compare-bar-clear" onClick={()=>setCompareList([])}>Clear all</button>
        <button className="compare-bar-btn" disabled={compareList.length<2} onClick={()=>setShowCompare(true)}>
          Compare {compareList.length>1?compareList.length:''} schools →
        </button>
      </div>
      {showCompare && compareList.length>=2 && (()=>{
        const phases = compareList.map(s=>(s.phase||'').toLowerCase());
        const hasSecondary = phases.some(p=>p.includes('secondary')||p.includes('16'));
        const hasPrimary = phases.some(p=>p.includes('primary')||p.includes('nursery')||p.includes('middle'));
        const allRows=[
          {label:'Borough',        fn:s=>s.local_authority||'—', always:true},
          {label:'Phase',          fn:s=>s.phase||'—', always:true},
          {label:'Ofsted rating',  fn:s=>s.quality_label||'Not rated', num:s=>s.ofsted_score, higher:true, always:true},
          {label:'Monitoring outcome',fn:s=>s.ungraded_outcome||'—', always:true},
          {label:'Composite score',fn:s=>s.ofsted_score!=null?s.ofsted_score+'%':'—', num:s=>s.ofsted_score, higher:true, always:true},
          {label:'Apps per place', fn:s=>s.apps_per_place!=null?s.apps_per_place+'×':'—', num:s=>s.apps_per_place, higher:false, always:true},
          {label:'Pupils',         fn:s=>s.pupils!=null?Number(s.pupils).toLocaleString():'—', always:true},
          {label:'Attainment 8 (GCSE)', fn:s=>s.ks4_att8!=null?s.ks4_att8:'N/A — primary', num:s=>s.ks4_att8, higher:true, secondary:true},
          {label:'Grade 5+ Eng & Maths',fn:s=>s.ks4_grade5_em!=null?s.ks4_grade5_em+'%':'N/A — primary', num:s=>s.ks4_grade5_em, higher:true, secondary:true},
          {label:'KS2 higher standard',  fn:s=>s.ks2_higher_pct!=null?s.ks2_higher_pct+'%':s.ks4_att8!=null?'N/A — secondary':'No data', num:s=>s.ks2_higher_pct, higher:true, primary:true},
          {label:'KS2 expected standard',fn:s=>s.ks2_expected_pct!=null?s.ks2_expected_pct+'%':s.ks4_att8!=null?'N/A — secondary':'No data', num:s=>s.ks2_expected_pct, higher:true, primary:true},
          {label:'Gender',         fn:s=>s.gender||'Mixed', always:true},
          {label:'Sixth form',     fn:s=>s.sixth_form==='Has a sixth form'?'✓ Yes':'No', always:true},
          {label:'Faith',          fn:s=>s.religious_character&&s.religious_character!=='Does not apply'&&s.religious_character!=='None'?s.religious_character:'None', always:true},
          {label:'Deprivation',    fn:s=>s.fsm_label||'—', always:true},
          {label:'Crime',          fn:s=>s.crime_label||'—', always:true},
        ];
        const rows = allRows.filter(r => {
          const typeMatch = r.always ||
            (r.secondary && hasSecondary) ||
            (r.primary && hasPrimary) ||
            (r.secondary && !hasSecondary && !hasPrimary) ||
            (r.primary && !hasPrimary && !hasSecondary);
          if (!typeMatch) return false;
          const vals = compareList.map(s => r.fn(s));
          const allEmpty = vals.every(v => v === '—' || v === null || v === undefined);
          return !allEmpty;
        });
        const cols=compareList.length;
        const gridCols=`170px repeat(${cols},minmax(160px,1fr))`;
        const gridMinW=cols*160+170;
        function compareUrl() {
          var urns = compareList.map(function(s){return s.urn;}).join(',');
          return 'https://londonschool.directory/?compare='+urns;
        }
        function doShareWA() {
          var url = compareUrl();
          var names = compareList.map(function(s){return '*'+s.name+'*';}).join(' vs ');
          var text = '📊 Compare London schools: '+names+'\n\n'+url+'\n\nvia London Schools Explorer';
          window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
        }
        function doShareEmail() {
          var url = compareUrl();
          var out = ['School comparison — London Schools Explorer','','View comparison: '+url,''];
          compareList.forEach(function(s,i) {
            out.push((i+1)+'. '+s.name+' ('+s.local_authority+')');
            out.push('   Ofsted: '+(s.quality_label||'Not rated'));
            if(s.ks4_att8!=null) out.push('   Attainment 8: '+s.ks4_att8);
            if(s.ks2_expected_pct!=null) out.push('   KS2 expected: '+s.ks2_expected_pct+'%');
            if(s.apps_per_place!=null) out.push('   Apps/place: '+s.apps_per_place+'x');
            out.push('');
          });
          window.location.href='mailto:?subject='+encodeURIComponent('School comparison — London Schools Explorer')+'&body='+encodeURIComponent(out.join('\n'));
        }
        function doCopyLink(btn) {
          var url = compareUrl();
          if(navigator.clipboard) {
            navigator.clipboard.writeText(url).then(function(){
              btn.textContent='Copied!';
              setTimeout(function(){btn.textContent='Copy link';},2000);
            });
          } else {
            window.prompt('Copy this link:',url);
          }
        }
        return(
          <div className="cmp-overlay" onClick={e=>{if(e.target===e.currentTarget)setShowCompare(false)}}>
            <div className="cmp-modal">
              <div className="cmp-header">
                <h2>Side-by-side comparison</h2>
                <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end',gap:8}}>
                  <button onClick={doShareWA} style={{padding:'6px 12px',background:'#25D366',color:'#fff',border:'none',borderRadius:6,fontSize:'0.8rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>WhatsApp</button>
                  <button onClick={doShareEmail} style={{padding:'6px 12px',background:'#1565C0',color:'#fff',border:'none',borderRadius:6,fontSize:'0.8rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Email</button>
                  <button onClick={e=>doCopyLink(e.currentTarget)} style={{padding:'6px 12px',background:'#555',color:'#fff',border:'none',borderRadius:6,fontSize:'0.8rem',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>Copy link</button>
                  <button className="cmp-close" onClick={()=>setShowCompare(false)}>&times;</button>
                </div>
              </div>
              {compareList.some(s=>s.ks2_higher_pct==null&&s.ks4_att8==null) && (
                <div style={{background:'#FFF8E1',borderBottom:'1px solid #FFE082',padding:'10px 20px',fontSize:'0.8rem',color:'#7B5800',display:'flex',gap:8,alignItems:'flex-start'}}>
                  <span style={{flexShrink:0}}>ℹ️</span>
                  <span>
                    <strong>Exam data:</strong> KS2 results are published for primary schools by the DfE each autumn.
                    KS4 (GCSE) results apply to secondary schools only.
                    If a school shows "No data" it may be a nursery, new school, or data may not yet be in our dataset — visit the school page for the latest Ofsted report.
                  </span>
                </div>
              )}
              <div style={{overflowX:'auto'}}>
                <div style={{display:'grid',gridTemplateColumns:gridCols,minWidth:gridMinW}}>
                  <div className="cmp-cell label" style={{background:'#1A1A2E',zIndex:3}}></div>
                  {compareList.map(s=>{
                    const band=s.score_band||s.quality_label||'Unknown';
                    const col=BAND_COLORS[band]||'#95A5A6';
                    return(
                      <div key={s.urn} className="cmp-cell school-header" style={{borderTop:`4px solid ${col}`}}>
                        <div className="cmp-school-name">{s.name}</div>
                        <div className="cmp-school-la">{s.local_authority} · {s.postcode}</div>
                        <div style={{marginTop:8}}><span className="band-chip" style={{background:col}}>{band}</span></div>
                      </div>
                    );
                  })}
                  {rows.map(row=>{
                    const nums=row.num?compareList.map(s=>row.num(s)).filter(v=>v!=null):[];
                    const best=nums.length>1?(row.higher?Math.max(...nums):Math.min(...nums)):null;
                    const worst=nums.length>1?(row.higher?Math.min(...nums):Math.max(...nums)):null;
                    return(
                      <React.Fragment key={row.label}>
                        <div className="cmp-cell label">{row.label}</div>
                        {compareList.map(s=>{
                          const num=row.num?row.num(s):null;
                          const isBest=num!=null&&num===best&&best!==worst;
                          const isWorst=num!=null&&num===worst&&best!==worst;
                          return(
                            <div key={s.urn} className={`cmp-cell${isBest?' cmp-best':isWorst?' cmp-worst':''}`}>
                              {row.fn(s)}
                              {isBest&&<span style={{marginLeft:6,fontSize:'0.68rem',color:'#2E7D32',fontWeight:600}}>▲</span>}
                            </div>
                          );
                        })}
                      </React.Fragment>
                    );
                  })}
                  <div className="cmp-cell label">View</div>
                  {compareList.map(s=>(
                    <div key={s.urn} className="cmp-cell" style={{display:'flex',flexDirection:'column',gap:6}}>
                      <a href={schoolUrl(s)} style={{display:'block',padding:'7px 12px',background:'var(--ink)',color:'var(--gold)',borderRadius:5,fontSize:'0.8rem',fontWeight:600,textDecoration:'none',textAlign:'center'}}>View school →</a>
                      <button onClick={()=>setCompareList(p=>p.filter(x=>x.urn!==s.urn))} style={{padding:'6px',background:'transparent',border:'1px solid #ddd',borderRadius:5,fontSize:'0.75rem',cursor:'pointer',color:'#999'}}>Remove</button>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{borderTop:'2px solid #e0e0e0',padding:'12px 20px',display:'flex',alignItems:'center',gap:8,background:'#f5f5f5',flexShrink:0}}>
                <span style={{fontSize:'0.82rem',color:'#555',fontWeight:700,marginRight:4}}>Share:</span>
                <button onClick={doShareWA} style={{padding:'8px 18px',background:'#25D366',color:'#fff',border:'none',borderRadius:7,fontSize:'0.85rem',fontWeight:700,cursor:'pointer'}}>WhatsApp</button>
                <button onClick={doShareEmail} style={{padding:'8px 18px',background:'#1565C0',color:'#fff',border:'none',borderRadius:7,fontSize:'0.85rem',fontWeight:700,cursor:'pointer'}}>Email</button>
                <button onClick={e=>doCopyLink(e.currentTarget)} style={{padding:'8px 18px',background:'#555',color:'#fff',border:'none',borderRadius:7,fontSize:'0.85rem',fontWeight:700,cursor:'pointer'}}>Copy link</button>
              </div>
            </div>
          </div>
        );
      })()}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
